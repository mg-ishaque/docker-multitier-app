name: devops-monitor

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: multitier-frontend:v2
    ports:
      - "8081:80"
    networks:
      - app-net
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: multitier-backend:v2
    ports:
      - "8080:8080"
    networks:
      - app-net
      - db-net
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    env_file:
      - .env
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - db-net
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysql -u "$$MYSQL_USER" -p"$$MYSQL_PASSWORD" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

networks:
  app-net:
    external: true
    name: app-net

  db-net:
    external: true
    name: db-net

volumes:
  mysql-data:
    external: true
    name: mysql-data